name: P20 CPU-only LLVM 23 checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-llvm-23:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Prepare the pinned official LLVM SDK
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/LLVM-23.1.4-Linux-X64.tar.zst"
          curl --fail --location --retry 3 \
            https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.4/LLVM-23.1.4-Linux-X64.tar.zst \
            --output "$archive"
          echo "efdd1dbd089b99bfcfcde7b8eb1236163f2e88df5a981cca4f783ec9cb5e0378  $archive" | sha256sum --check
          sdk="$RUNNER_TEMP/llvm-23.1.4"
          mkdir "$sdk"
          tar --use-compress-program='zstd --decompress --long=30' \
            --extract --file "$archive" --directory "$sdk" --strip-components=1
          echo "LLVM_HOME=$sdk" >> "$GITHUB_ENV"
          test "$("$sdk/bin/llvm-config" --version)" = 23.1.4
          "$sdk/bin/llc" --version > "$RUNNER_TEMP/llvm-23-llc-version.txt"
          grep -Eiq '^[[:space:]]*nvptx64[[:space:]]+-' "$RUNNER_TEMP/llvm-23-llc-version.txt"

      - name: Build shared-memory optimizer with llvm-config
        shell: bash
        run: |
          set -euo pipefail
          read -r -a cxxflags <<< "$("$LLVM_HOME/bin/llvm-config" --cxxflags)"
          read -r -a ldflags <<< "$("$LLVM_HOME/bin/llvm-config" --ldflags)"
          read -r -a llvmlibs <<< "$("$LLVM_HOME/bin/llvm-config" --libs core analysis irreader passes support)"
          read -r -a systemlibs <<< "$("$LLVM_HOME/bin/llvm-config" --system-libs)"
          mkdir -p build/ci/bin
          g++ "${cxxflags[@]}" -std=c++17 -Iinclude \
            tools/SharedMemoryMain.cpp \
            lib/PrivateSharedSlotPromotion.cpp \
            lib/StencilSharedCache.cpp \
            -o build/ci/bin/shared-memory-opt \
            "${ldflags[@]}" "${llvmlibs[@]}" "${systemlibs[@]}"

      - name: Verify LLVM IR legality and NVPTX lowering (CPU only)
        shell: bash
        run: |
          set -euo pipefail
          opt="$LLVM_HOME/bin/opt"
          llc="$LLVM_HOME/bin/llc"
          optimizer="$PWD/build/ci/bin/shared-memory-opt"
          mkdir -p build/ci/evidence
          python3 tools/check-stencil.py --optimizer "$optimizer" \
            --llvm-bin "$LLVM_HOME/bin" --evidence build/ci/evidence/stencil-legality

          stencil=test/Inputs/P20Stencil.ll
          "$optimizer" "$stencil" -o build/ci/evidence/stencil.optimized.ll
          "$opt" -passes=verify -disable-output "$stencil"
          "$opt" -passes=verify -disable-output build/ci/evidence/stencil.optimized.ll
          "$llc" -march=nvptx64 -mcpu=sm_120 "$stencil" -o build/ci/evidence/stencil.original.ptx
          "$llc" -march=nvptx64 -mcpu=sm_120 build/ci/evidence/stencil.optimized.ll -o build/ci/evidence/stencil.optimized.ptx
          grep -Fq 'ld.shared.b32' build/ci/evidence/stencil.optimized.ptx
          grep -Fq 'st.shared.b32' build/ci/evidence/stencil.optimized.ptx
          grep -Fq 'bar.sync' build/ci/evidence/stencil.optimized.ptx

          private=test/Inputs/P20PrivateSlot.ll
          "$optimizer" "$private" -o build/ci/evidence/private.optimized.ll
          "$opt" -passes=verify -disable-output "$private"
          "$opt" -passes=verify -disable-output build/ci/evidence/private.optimized.ll
          "$llc" -march=nvptx64 -mcpu=sm_120 "$private" -o build/ci/evidence/private.original.ptx
          "$llc" -march=nvptx64 -mcpu=sm_120 build/ci/evidence/private.optimized.ll -o build/ci/evidence/private.optimized.ptx
          grep -Fq 'bar.sync' build/ci/evidence/private.optimized.ptx
          ! grep -Eq '(ld|st)\.shared\.b32' build/ci/evidence/private.optimized.ptx

          for fixture in P20StencilByteInputGep P20StencilByteOutputGep; do
            input="test/Inputs/${fixture}.ll"
            output="build/ci/evidence/${fixture}.unchanged.ll"
            "$optimizer" "$input" -o "$output"
            "$opt" -passes=verify -disable-output "$output"
            ! grep -Fq '@p20.tile.' "$output"
            grep -Fq 'getelementptr inbounds i8' "$output"
          done

          input=test/Inputs/P20PrivateSlotByteGep.ll
          output=build/ci/evidence/P20PrivateSlotByteGep.unchanged.ll
          "$optimizer" "$input" -o "$output"
          "$opt" -passes=verify -disable-output "$output"
          grep -Fq 'getelementptr inbounds [128 x i8]' "$output"
          grep -Fq 'load i32, ptr addrspace(3)' "$output"

          echo 'LLVM IR verification and NVPTX code generation passed. No GPU was used.'
